# descontos.bot - rotação dos logs escritos por redirecionamento de shell.
#
# O RotatingFileHandler do Django (core/settings.py) já cobre o que passa pelo
# logging da aplicação. O que escapa dele são os `StandardOutput=append:` dos
# services systemd — foi assim que logs/ chegou a 650 MB, com wa_service.out
# sozinho em 508 MB.
#
# copytruncate é obrigatório aqui: os services seguram o descritor aberto e não
# reabrem o arquivo depois da rotação. Sem isso, o processo continuaria
# escrevendo no inode antigo e o arquivo novo ficaria vazio para sempre.

/mnt/c/Users/marce/Documents/Projetos/descontos.bot/logs/*.log {
    daily
    rotate 7
    maxsize 50M
    copytruncate
    compress
    delaycompress
    missingok
    notifempty
    nocreate
}
